minimumReleaseAgeExclude:
  - playwright-core@1.64.1
# pnpm >=11: build-script approval map (replaces removed onlyBuiltDependencies).
# CI (strictDepBuilds=true) fails with ERR_PNPM_IGNORED_BUILDS without these.
allowBuilds:
  esbuild: true
  workerd: true
# Do not auto-install optional peers (geist->next, satoru-render->react/jsdom/...)
autoInstallPeers: false
